name: Build F&O Master

on:
  workflow_dispatch:

  # Run every weekday at 09:00 IST
  # 03:30 UTC = 09:00 IST
  schedule:
    - cron: '30 3 * * 1-5'

permissions:
  contents: write

jobs:
  build-fno-master:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================================
      # 3. Download NSE F&O lot-size CSV
      # =========================================================
      - name: Download NSE F&O Lot Size File
        shell: bash
        run: |
          set -e

          URL="https://nsearchives.nseindia.com/content/fo/fo_mktlots.csv"

          echo "Downloading NSE F&O lot-size file..."
          echo "URL: $URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            -H "Accept: text/csv,*/*" \
            -o /tmp/fo_mktlots.csv \
            "$URL"

          if [ ! -s /tmp/fo_mktlots.csv ]; then
            echo "ERROR: Downloaded file is empty."
            exit 1
          fi

          echo ""
          echo "Downloaded file:"
          ls -lh /tmp/fo_mktlots.csv

          echo ""
          echo "First 10 lines:"
          head -n 10 /tmp/fo_mktlots.csv

      # =========================================================
      # 4. Build F&O JSON
      # =========================================================
      - name: Build F&O Master JSON
        shell: bash
        run: |
          set -e

          python3 << 'PYEOF'

          import csv
          import json
          import os
          import sys
          from datetime import datetime, timezone

          INPUT_FILE = "/tmp/fo_mktlots.csv"
          OUTPUT_FILE = "stocks/fno_master.json"

          print("========================================")
          print("NSE F&O CSV -> JSON")
          print("========================================")

          # -----------------------------------------------------
          # Helper
          # -----------------------------------------------------

          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()

          # -----------------------------------------------------
          # Index symbols to exclude
          # -----------------------------------------------------

          INDEX_SYMBOLS = {
              "NIFTY",
              "BANKNIFTY",
              "FINNIFTY",
              "MIDCPNIFTY",
              "NIFTYNXT50",
              "NIFTYFPI"
          }

          # -----------------------------------------------------
          # Verify downloaded file
          # -----------------------------------------------------

          if not os.path.exists(INPUT_FILE):

              print(
                  f"ERROR: File not found: {INPUT_FILE}"
              )

              sys.exit(1)

          # -----------------------------------------------------
          # Read CSV
          #
          # IMPORTANT:
          # This NSE file does not have a single "Lot Size"
          # column.
          #
          # Structure:
          #
          # UNDERLYING, SYMBOL, SEP-26, OCT-26, NOV-26, ...
          #
          # We use the LAST available non-empty monthly value
          # as the lot size.
          # -----------------------------------------------------

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.reader(f)

              rows = list(reader)

          if not rows:

              print("ERROR: CSV is empty.")
              sys.exit(1)

          # -----------------------------------------------------
          # Header
          # -----------------------------------------------------

          header = [
              clean(x)
              for x in rows[0]
          ]

          print("")
          print("CSV columns:")

          for index, column in enumerate(header):
              print(
                  f"  {index}: {column}"
              )

          # -----------------------------------------------------
          # Validate basic structure
          # -----------------------------------------------------

          if len(header) < 3:

              print(
                  "ERROR: Unexpected CSV structure."
              )

              sys.exit(1)

          # First two columns are:
          #
          # 0 = UNDERLYING
          # 1 = SYMBOL
          #
          # Everything after column 1 is a monthly expiry.
          # -----------------------------------------------------

          monthly_columns = header[2:]

          print("")
          print(
              f"Monthly columns found: "
              f"{len(monthly_columns)}"
          )

          # -----------------------------------------------------
          # Locate individual securities section
          # -----------------------------------------------------

          individual_section_found = False
          individual_section_row = None

          for row_index, row in enumerate(rows):

              if not row:
                  continue

              first_cell = clean(row[0])

              if (
                  "Derivatives on Individual Securities"
                  in first_cell
              ):

                  individual_section_found = True
                  individual_section_row = row_index

                  print("")
                  print(
                      "Individual securities section "
                      f"found at CSV row "
                      f"{row_index + 1}"
                  )

                  break

          if not individual_section_found:

              print("")
              print(
                  "ERROR: Could not find "
                  "'Derivatives on Individual Securities' "
                  "section."
              )

              sys.exit(1)

          # -----------------------------------------------------
          # Process individual-security rows
          # -----------------------------------------------------

          result = {}

          total_stock_rows = 0
          skipped_rows = 0
          invalid_rows = 0
          duplicate_rows = 0

          for row_number in range(
              individual_section_row + 1,
              len(rows)
          ):

              row = rows[row_number]

              if not row:
                  continue

              # Make sure row has enough columns
              if len(row) < 2:
                  skipped_rows += 1
                  continue

              underlying = clean(row[0])
              symbol = clean(row[1])

              # -------------------------------------------------
              # Skip blank rows
              # -------------------------------------------------

              if not symbol:
                  skipped_rows += 1
                  continue

              total_stock_rows += 1

              symbol_upper = symbol.upper()

              # -------------------------------------------------
              # Safety: remove index contracts
              # -------------------------------------------------

              if symbol_upper in INDEX_SYMBOLS:

                  skipped_rows += 1

                  print(
                      f"Skipping index: {symbol_upper}"
                  )

                  continue

              # -------------------------------------------------
              # Read monthly values
              #
              # Find the LAST non-empty value.
              # -------------------------------------------------

              last_lot_size = None
              last_expiry = None

              # Monthly data begins at column 2
              for column_index in range(
                  2,
                  len(row)
              ):

                  value = clean(
                      row[column_index]
                  )

                  if not value:
                      continue

                  # ---------------------------------------------
                  # Try to convert lot size to integer
                  # ---------------------------------------------

                  try:

                      lot_size = int(
                          float(value)
                      )

                  except ValueError:

                      # Ignore non-numeric values
                      continue

                  if lot_size <= 0:
                      continue

                  last_lot_size = lot_size

                  if column_index < len(header):
                      last_expiry = clean(
                          header[column_index]
                      )

              # -------------------------------------------------
              # No valid lot size
              # -------------------------------------------------

              if last_lot_size is None:

                  invalid_rows += 1

                  print(
                      f"Skipping {symbol_upper}: "
                      f"no valid lot size found"
                  )

                  continue

              # -------------------------------------------------
              # Duplicate symbol
              # -------------------------------------------------

              if symbol_upper in result:

                  duplicate_rows += 1

                  # Keep the latest occurrence
                  result[
                      symbol_upper
                  ] = {
                      "IsFO": True,
                      "Lotsize": last_lot_size
                  }

                  continue

              # -------------------------------------------------
              # Add stock
              # -------------------------------------------------

              result[symbol_upper] = {
                  "IsFO": True,
                  "Lotsize": last_lot_size
              }

              print(
                  f"{symbol_upper}: "
                  f"LotSize={last_lot_size} "
                  f"(last expiry={last_expiry})"
              )

          # =====================================================
          # Validation summary
          # =====================================================

          print("")
          print("========================================")
          print("VALIDATION RESULT")
          print("========================================")

          print(
              f"Stock rows found : "
              f"{total_stock_rows}"
          )

          print(
              f"F&O stocks       : "
              f"{len(result)}"
          )

          print(
              f"Skipped rows     : "
              f"{skipped_rows}"
          )

          print(
              f"Invalid rows     : "
              f"{invalid_rows}"
          )

          print(
              f"Duplicate rows   : "
              f"{duplicate_rows}"
          )

          # -----------------------------------------------------
          # Safety check
          # -----------------------------------------------------

          if len(result) == 0:

              print("")
              print(
                  "ERROR: No F&O stocks found."
              )

              print(
                  "Existing fno_master.json "
                  "will NOT be replaced."
              )

              sys.exit(1)

          # =====================================================
          # Sort alphabetically
          # =====================================================

          result = dict(
              sorted(
                  result.items()
              )
          )

          # =====================================================
          # Build final JSON
          # =====================================================

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "count": len(result),

              "data": result
          }

          # =====================================================
          # Create output directory
          # =====================================================

          os.makedirs(
              "stocks",
              exist_ok=True
          )

          # =====================================================
          # Write temporary file
          # =====================================================

          temp_file = (
              OUTPUT_FILE + ".tmp"
          )

          with open(
              temp_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          # =====================================================
          # Replace existing JSON
          # =====================================================

          os.replace(
              temp_file,
              OUTPUT_FILE
          )

          # =====================================================
          # Success
          # =====================================================

          print("")
          print("========================================")
          print("SUCCESS")
          print("========================================")

          print(
              f"Output file: {OUTPUT_FILE}"
          )

          print(
              f"F&O stocks : {len(result)}"
          )

          print("")
          print("First 10 records:")

          for symbol, info in list(
              result.items()
          )[:10]:

              print(
                  f"{symbol} -> "
                  f"IsFO={info['IsFO']}, "
                  f"Lotsize={info['Lotsize']}"
              )

          PYEOF

      # =========================================================
      # 5. Validate generated JSON
      # =========================================================
      - name: Validate F&O JSON
        shell: bash
        run: |
          set -e

          if [ ! -f "stocks/fno_master.json" ]; then
            echo "ERROR: fno_master.json was not created."
            exit 1
          fi

          python3 << 'PYEOF'

          import json

          FILE = "stocks/fno_master.json"

          with open(
              FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          # -----------------------------------------------------
          # Top-level validation
          # -----------------------------------------------------

          required_top_level = [
              "updated_at",
              "count",
              "data"
          ]

          for field in required_top_level:

              if field not in data:

                  raise Exception(
                      f"Missing top-level field: {field}"
                  )

          # -----------------------------------------------------
          # Count validation
          # -----------------------------------------------------

          if data["count"] != len(
              data["data"]
          ):

              raise Exception(
                  f"Count mismatch: "
                  f"{data['count']} != "
                  f"{len(data['data'])}"
              )

          # -----------------------------------------------------
          # Record validation
          # -----------------------------------------------------

          for symbol, info in (
              data["data"].items()
          ):

              if info.get("IsFO") is not True:

                  raise Exception(
                      f"{symbol}: "
                      f"IsFO is not true"
                  )

              lot_size = info.get(
                  "Lotsize"
              )

              if not isinstance(
                  lot_size,
                  int
              ):

                  raise Exception(
                      f"{symbol}: "
                      f"invalid lot size"
                  )

              if lot_size <= 0:

                  raise Exception(
                      f"{symbol}: "
                      f"lot size must be greater than zero"
                  )

          print(
              "F&O JSON validation successful."
          )

          print(
              f"Total F&O stocks: "
              f"{data['count']}"
          )

          PYEOF

      # =========================================================
      # 6. Display result
      # =========================================================
      - name: Display F&O Master Summary
        shell: bash
        run: |
          echo "========================================"
          echo "F&O MASTER SUMMARY"
          echo "========================================"

          ls -lh stocks/fno_master.json

          python3 << 'PYEOF'

          import json

          with open(
              "stocks/fno_master.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("")
          print(
              "Updated At:",
              data["updated_at"]
          )

          print(
              "F&O Stocks:",
              data["count"]
          )

          print("")
          print("First 10:")

          for symbol, info in list(
              data["data"].items()
          )[:10]:

              print(
                  f"{symbol} -> "
                  f"IsFO={info['IsFO']}, "
                  f"Lotsize={info['Lotsize']}"
              )

          PYEOF

      # =========================================================
      # 7. Commit and push
      # =========================================================
      - name: Commit and Push F&O Master
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Adding fno_master.json..."

          git add stocks/fno_master.json

          if git diff --cached --quiet; then

            echo "No changes to fno_master.json."

            exit 0

          fi

          echo "Changes detected."

          git commit \
            -m "Update F&O master"

          git push

          echo "F&O master updated successfully."