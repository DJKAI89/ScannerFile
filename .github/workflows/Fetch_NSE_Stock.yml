name: Build Stock Master

on:
  # Run manually from GitHub Actions
  workflow_dispatch:

  # Automatically run whenever the CSV is added/replaced/updated
  push:
    paths:
      - 'stocks/nifty500.csv'

permissions:
  contents: write

jobs:
  build-stock-master:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================================
      # 3. Verify CSV exists
      # =========================================================
      - name: Verify Input CSV
        shell: bash
        run: |
          set -e

          echo "Checking input CSV..."

          if [ ! -f "stocks/nifty500.csv" ]; then
            echo "ERROR: stocks/nifty500.csv was not found."
            exit 1
          fi

          echo ""
          echo "CSV file:"
          ls -lh stocks/nifty500.csv

          echo ""
          echo "CSV preview:"
          head -n 5 stocks/nifty500.csv

      # =========================================================
      # 4. Convert CSV to JSON
      # =========================================================
      - name: Convert CSV to JSON
        shell: bash
        run: |
          set -e

          python3 << 'PYEOF'

          import csv
          import json
          import os
          import sys
          from datetime import datetime, timezone

          INPUT_FILE = "stocks/nifty500.csv"
          OUTPUT_FILE = "stocks/stocks.json"

          print("========================================")
          print("CSV -> JSON")
          print("========================================")

          # -----------------------------------------------------
          # Helper function
          # -----------------------------------------------------
          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()

          # -----------------------------------------------------
          # Find column by multiple possible names
          # -----------------------------------------------------
          def find_column(fieldnames, candidates):

              if not fieldnames:
                  return None

              normalized = {}

              for field in fieldnames:

                  key = (
                      field.strip()
                      .lower()
                      .replace(" ", "")
                      .replace("_", "")
                      .replace("-", "")
                      .replace("(", "")
                      .replace(")", "")
                  )

                  normalized[key] = field

              for candidate in candidates:

                  key = (
                      candidate.strip()
                      .lower()
                      .replace(" ", "")
                      .replace("_", "")
                      .replace("-", "")
                      .replace("(", "")
                      .replace(")", "")
                  )

                  if key in normalized:
                      return normalized[key]

              return None

          # -----------------------------------------------------
          # Check input file
          # -----------------------------------------------------
          if not os.path.exists(INPUT_FILE):

              print(
                  f"ERROR: Input file does not exist: "
                  f"{INPUT_FILE}"
              )

              sys.exit(1)

          # -----------------------------------------------------
          # Read CSV
          # -----------------------------------------------------
          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig",
              newline=""
          ) as f:

              reader = csv.DictReader(f)

              fieldnames = reader.fieldnames

              if not fieldnames:

                  print("ERROR: CSV does not contain a header row.")
                  sys.exit(1)

              print("")
              print("CSV columns:")

              for field in fieldnames:
                  print(f"  - {field}")

              # -------------------------------------------------
              # Detect columns
              # -------------------------------------------------

              symbol_col = find_column(
                  fieldnames,
                  [
                      "Symbol",
                      "Stock Symbol",
                      "Ticker",
                      "Ticker Symbol"
                  ]
              )

              isin_col = find_column(
                  fieldnames,
                  [
                      "ISIN",
                      "ISIN Code",
                      "ISIN_Code",
                      "ISIN No",
                      "ISIN Number"
                  ]
              )

              name_col = find_column(
                  fieldnames,
                  [
                      "Company Name",
                      "CompanyName",
                      "Name",
                      "Company"
                  ]
              )

              sector_col = find_column(
                  fieldnames,
                  [
                      "Sector",
                      "Sector Name",
                      "Industry",
                      "Industry Name"
                  ]
              )

              print("")
              print("Detected columns:")
              print(f"  Symbol : {symbol_col}")
              print(f"  ISIN   : {isin_col}")
              print(f"  Name   : {name_col}")
              print(f"  Sector : {sector_col}")

              # -------------------------------------------------
              # Required column validation
              # -------------------------------------------------

              missing_columns = []

              if not symbol_col:
                  missing_columns.append("Symbol")

              if not isin_col:
                  missing_columns.append("ISIN")

              if not name_col:
                  missing_columns.append("Company Name")

              if not sector_col:
                  missing_columns.append("Sector")

              if missing_columns:

                  print("")
                  print("ERROR: Required columns are missing:")

                  for column in missing_columns:
                      print(f"  - {column}")

                  print("")
                  print("Available columns:")

                  for field in fieldnames:
                      print(f"  - {field}")

                  sys.exit(1)

              # -------------------------------------------------
              # Process ALL CSV rows
              # -------------------------------------------------

              result = []

              duplicate_symbols = set()
              duplicate_isins = set()

              seen_symbols = set()
              seen_isins = set()

              invalid_rows = []

              total_csv_rows = 0
              empty_rows = 0

              for row_number, row in enumerate(
                  reader,
                  start=2
              ):

                  total_csv_rows += 1

                  symbol = clean(
                      row.get(symbol_col)
                  )

                  isin = clean(
                      row.get(isin_col)
                  )

                  name = clean(
                      row.get(name_col)
                  )

                  sector = clean(
                      row.get(sector_col)
                  )

                  # -------------------------------------------------
                  # Ignore completely empty rows
                  # -------------------------------------------------

                  if (
                      not symbol
                      and not isin
                      and not name
                      and not sector
                  ):

                      empty_rows += 1
                      continue

                  # -------------------------------------------------
                  # Validate row
                  # -------------------------------------------------

                  errors = []

                  if not symbol:
                      errors.append("missing symbol")

                  if not isin:
                      errors.append("missing ISIN")

                  if not name:
                      errors.append("missing company name")

                  if not sector:
                      errors.append("missing sector")

                  if errors:

                      invalid_rows.append({
                          "row": row_number,
                          "errors": errors
                      })

                      continue

                  # -------------------------------------------------
                  # Duplicate detection
                  # -------------------------------------------------

                  symbol_upper = symbol.upper()
                  isin_upper = isin.upper()

                  if symbol_upper in seen_symbols:
                      duplicate_symbols.add(symbol_upper)

                  if isin_upper in seen_isins:
                      duplicate_isins.add(isin_upper)

                  seen_symbols.add(symbol_upper)
                  seen_isins.add(isin_upper)

                  # -------------------------------------------------
                  # Build JSON record
                  # -------------------------------------------------

                  result.append({
                      "symbol": symbol_upper,
                      "isin": isin_upper,
                      "name": name,
                      "key": f"NSE_EQ|{isin_upper}",
                      "sector": sector
                  })

          # =========================================================
          # Validation
          # =========================================================

          print("")
          print("========================================")
          print("VALIDATION RESULT")
          print("========================================")

          print(f"CSV rows       : {total_csv_rows}")
          print(f"Empty rows     : {empty_rows}")
          print(f"Valid records  : {len(result)}")
          print(f"Invalid rows   : {len(invalid_rows)}")
          print(
              f"Duplicate symbols : "
              f"{len(duplicate_symbols)}"
          )
          print(
              f"Duplicate ISINs   : "
              f"{len(duplicate_isins)}"
          )

          # ---------------------------------------------------------
          # IMPORTANT:
          # No limitation on record count.
          #
          # Whatever number of valid records exists in the CSV
          # will be converted to JSON.
          # ---------------------------------------------------------

          if len(result) == 0:

              print("")
              print(
                  "ERROR: No valid records found in CSV."
              )

              print(
                  "Existing stocks.json will NOT be replaced."
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Invalid rows
          # ---------------------------------------------------------

          if invalid_rows:

              print("")
              print("ERROR: Invalid rows found:")

              for item in invalid_rows[:50]:

                  print(
                      f"  Row {item['row']}: "
                      + ", ".join(item["errors"])
                  )

              if len(invalid_rows) > 50:

                  print(
                      f"  ... and "
                      f"{len(invalid_rows) - 50} more"
                  )

              print("")
              print(
                  "stocks.json was NOT replaced."
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Duplicate symbols
          # ---------------------------------------------------------

          if duplicate_symbols:

              print("")
              print("ERROR: Duplicate symbols found:")

              for symbol in sorted(
                  duplicate_symbols
              ):
                  print(f"  - {symbol}")

              print("")
              print(
                  "stocks.json was NOT replaced."
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Duplicate ISINs
          # ---------------------------------------------------------

          if duplicate_isins:

              print("")
              print("ERROR: Duplicate ISINs found:")

              for isin in sorted(
                  duplicate_isins
              ):
                  print(f"  - {isin}")

              print("")
              print(
                  "stocks.json was NOT replaced."
              )

              sys.exit(1)

          # =========================================================
          # Sort records
          # =========================================================

          result.sort(
              key=lambda x: x["symbol"]
          )

          # =========================================================
          # Build final JSON
          # =========================================================

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),

              "count": len(result),

              "data": result
          }

          # =========================================================
          # Write temporary JSON first
          # =========================================================

          os.makedirs(
              os.path.dirname(OUTPUT_FILE),
              exist_ok=True
          )

          temp_file = OUTPUT_FILE + ".tmp"

          with open(
              temp_file,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

              f.write("\n")

          # ---------------------------------------------------------
          # Replace old JSON only after successful generation
          # ---------------------------------------------------------

          os.replace(
              temp_file,
              OUTPUT_FILE
          )

          # =========================================================
          # Success
          # =========================================================

          print("")
          print("========================================")
          print("SUCCESS")
          print("========================================")

          print(
              f"Input CSV       : {INPUT_FILE}"
          )

          print(
              f"Output JSON     : {OUTPUT_FILE}"
          )

          print(
              f"Records created : {len(result)}"
          )

          print("")
          print("Sample records:")

          for stock in result[:5]:

              print(
                  f"{stock['symbol']} | "
                  f"{stock['isin']} | "
                  f"{stock['sector']}"
              )

          PYEOF

      # =========================================================
      # 5. Validate generated JSON
      # =========================================================
      - name: Validate Generated JSON
        shell: bash
        run: |
          set -e

          if [ ! -f "stocks/stocks.json" ]; then
            echo "ERROR: stocks/stocks.json was not created."
            exit 1
          fi

          python3 << 'PYEOF'

          import json

          FILE = "stocks/stocks.json"

          with open(
              FILE,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          # -----------------------------------------------------
          # Top-level validation
          # -----------------------------------------------------

          required_top_level = [
              "updated_at",
              "count",
              "data"
          ]

          for field in required_top_level:

              if field not in data:

                  raise Exception(
                      f"Missing top-level field: {field}"
                  )

          # -----------------------------------------------------
          # Count validation
          # -----------------------------------------------------

          if data["count"] != len(data["data"]):

              raise Exception(
                  f"Count mismatch: "
                  f"{data['count']} != "
                  f"{len(data['data'])}"
              )

          # -----------------------------------------------------
          # Record validation
          # -----------------------------------------------------

          required_fields = [
              "symbol",
              "isin",
              "name",
              "key",
              "sector"
          ]

          for index, stock in enumerate(
              data["data"]
          ):

              for field in required_fields:

                  if field not in stock:

                      raise Exception(
                          f"Record {index} "
                          f"missing field: {field}"
                      )

                  if not stock[field]:

                      raise Exception(
                          f"Record {index} "
                          f"has empty field: {field}"
                      )

          print("JSON validation successful.")
          print(
              f"Total records: {data['count']}"
          )

          PYEOF

      # =========================================================
      # 6. Display summary
      # =========================================================
      - name: Display Stock Master Summary
        shell: bash
        run: |
          echo "========================================"
          echo "STOCK MASTER SUMMARY"
          echo "========================================"

          ls -lh stocks/stocks.json

          python3 << 'PYEOF'

          import json

          with open(
              "stocks/stocks.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("")
          print("Updated At :", data["updated_at"])
          print("Count      :", data["count"])

          print("")
          print("First 5 records:")

          for stock in data["data"][:5]:

              print(
                  f"{stock['symbol']} | "
                  f"{stock['isin']} | "
                  f"{stock['name']} | "
                  f"{stock['sector']}"
              )

          PYEOF

      # =========================================================
      # 7. Commit and push stocks.json
      # =========================================================
      - name: Commit and Push Stock Master
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Adding stocks.json..."

          git add stocks/stocks.json

          if git diff --cached --quiet; then

            echo "No changes detected in stocks.json."
            exit 0

          fi

          echo "Changes detected."

          git commit \
            -m "Update stock master from CSV"

          git push

          echo "Stock master updated successfully."